<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Publisher Tech Newsletter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <canvas id="bg"></canvas>
  <main>
    <h1>📰 Publisher Tech Brief</h1>
    <div class="newsletter">
      {% for row in news %}
      <div class="news-card">
        <div class="dot"></div>
        <div>
          <div class="news-title">{{ row['title'] }}</div>
          <div class="news-meta">
            <span>{{ row['published']|datetimeformat }}</span> &middot; 
            <a href="{{ row['url'] }}" target="_blank">Read Full Article</a>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </main>
  <script src="/static/techbg.js"></script>
</body>
</html>
